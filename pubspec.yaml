name: itsclear_app
description: "itsclear™ exact-packaging ecommerce Android app UI — Flutter Android storefront."
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  http: ^1.3.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.0.0
  razorpay_flutter: ^1.4.7
  url_launcher: ^6.3.2
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
