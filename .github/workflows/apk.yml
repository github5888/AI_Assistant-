name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Analyze and build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate a matching Android runner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/itsclear_runner
          flutter create --no-pub --platforms=android \
            --project-name itsclear_app \
            --org com.itsclear.app \
            --description "itsclear premium ecommerce app UI" \
            /tmp/itsclear_runner
          # Keep the application's checked-in manifest (label and Internet permission).
          cp android/app/src/main/AndroidManifest.xml /tmp/itsclear_runner/android/app/src/main/AndroidManifest.xml
          # Preserve the published application ID registered for Android OAuth.
          python3 - <<'PY'
          import re
          from pathlib import Path
          generated = Path('/tmp/itsclear_runner/android/app/build.gradle.kts')
          local = Path('android/app/build.gradle.kts').read_text()
          app_id = re.search(r'applicationId\s*=\s*"([^"]+)"', local).group(1)
          gradle, count = re.subn(r'applicationId\s*=\s*"[^"]+"',
                                  f'applicationId = "{app_id}"', generated.read_text())
          assert count == 1, 'Expected one applicationId in generated runner'
          gradle = gradle.replace(
              '    id("dev.flutter.flutter-gradle-plugin")',
              '    id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")',
              1,
          )
          generated.write_text(gradle)

          settings = Path('/tmp/itsclear_runner/android/settings.gradle.kts')
          settings_text = settings.read_text()
          marker = 'plugins {\n'
          assert marker in settings_text, 'Expected a Gradle plugins block'
          settings_text = settings_text.replace(
              marker, marker + '    id("com.google.gms.google-services") version "4.4.4" apply false\n', 1
          )
          settings.write_text(settings_text)
          PY
          # Include the Firebase Android client configuration in the generated runner.
          cp android/app/google-services.json /tmp/itsclear_runner/android/app/google-services.json
          # Keep the native reverse-geocoding MethodChannel in the generated runner.
          mkdir -p /tmp/itsclear_runner/android/app/src/main/kotlin/com/itsclear/app
          cp android/app/src/main/kotlin/com/itsclear/app/MainActivity.kt \
            /tmp/itsclear_runner/android/app/src/main/kotlin/com/itsclear/app/MainActivity.kt
          cp -a /tmp/itsclear_runner/android/. android/
          cp -a /tmp/itsclear_runner/.metadata .metadata

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Test phone layouts
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsclear-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Annotate Flutter logs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def escape(value: str) -> str:
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          for name in ('analyze.log', 'test.log', 'build.log'):
              path = Path(name)
              if not path.exists():
                  continue
              lines = path.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  lowered = line.lower()
                  if name == 'test.log':
                      if ('overflowed by' in lowered or 'actually had no widget' in lowered or
                          line.strip().startswith(('Expected:', 'Exception:', 'Bad state:')) or
                          'The following assertion was thrown' in line):
                          details = '\n'.join(lines[max(0, i - 15):i + 12])
                          print(f'::error title=Phone layout test::{escape(details)}')
                  elif 'error' in lowered or 'failed' in lowered:
                      print(f'::error title={name}::{escape(line)}')
                  elif 'warning' in lowered:
                      print(f'::warning title={name}::{escape(line)}')
          PY

      - name: Upload Flutter logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-logs
          path: |
            analyze.log
            test.log
            build.log
          if-no-files-found: warn
